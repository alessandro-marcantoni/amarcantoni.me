name = "portfolio"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.5.2 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.5 and < 3.0.0"

[tools.lustre.bin]
# Lustre resolves relative paths against the working directory, so run it from the project root.
tailwindcss = "./.lustre/bin/tailwindcss-macos-arm64/tailwindcss-macos-arm64"

[tools.lustre.html]
title = "Alessandro Marcantoni - Portfolio"
links = [
  { rel = "icon", href = "imgs/profile.jpg" },
  { rel = "preconnect", href = "https://fonts.googleapis.com" },
  { rel = "preconnect", href = "https://fonts.gstatic.com", crossorigin = "" },
  { rel = "stylesheet", href = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" },
]
