name = "portfolio"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.5.2 and < 6.0.0"
modem = ">= 2.1.3 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.5 and < 3.0.0"

[tools.lustre.bin]
# Lustre resolves relative paths against the working directory, so run it from the project root.
tailwindcss = "./.lustre/bin/tailwindcss-macos-arm64/tailwindcss-macos-arm64"

[tools.lustre.html]
title = "Alessandro Marcantoni - Portfolio"
# og:image and og:url must be absolute for LinkedIn and Slack to use them.
meta = [
  { name = "description", content = "Alessandro Marcantoni, software engineer in Rimini, Italy. Event-driven microservices in Java and Quarkus, cloud systems on AWS and Kubernetes." },
  { property = "og:type", content = "website" },
  { property = "og:url", content = "https://amarcantoni.me/" },
  { property = "og:title", content = "Alessandro Marcantoni - Cloud & Software Engineer" },
  { property = "og:description", content = "Event-driven microservices in Java and Quarkus, cloud systems on AWS and Kubernetes." },
  { property = "og:image", content = "https://amarcantoni.me/imgs/profile.jpg" },
  { name = "twitter:card", content = "summary" },
  { name = "theme-color", content = "#0b1622" },
]
links = [
  { rel = "icon", href = "/imgs/profile.jpg" },
  { rel = "preload", href = "/fonts/jetbrains-mono-latin-wght-normal.woff2", as = "font", type = "font/woff2", crossorigin = "" },
]
